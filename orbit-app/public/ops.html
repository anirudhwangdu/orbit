<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#101a33;--mute:#65708a;--line:#e1e6f0;--acc:#3452d9;--accbg:#e4e9fc;--ok:#127a4f;--okbg:#d8f3e6;--warn:#8a5a00;--warnbg:#ffefc2;--bad:#b3261e;--badbg:#fde3e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1222;--card:#151d33;--ink:#e9edf8;--mute:#93a0bd;--line:#26314d;--acc:#8ea2ff;--accbg:#1f2b55;--ok:#6fe0aa;--okbg:#10372a;--warn:#ffd36b;--warnbg:#3d2e08;--bad:#ff9a92;--badbg:#401a17}}
:root[data-theme="dark"]{--bg:#0c1222;--card:#151d33;--ink:#e9edf8;--mute:#93a0bd;--line:#26314d;--acc:#8ea2ff;--accbg:#1f2b55;--ok:#6fe0aa;--okbg:#10372a;--warn:#ffd36b;--warnbg:#3d2e08;--bad:#ff9a92;--badbg:#401a17}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
.wrap{max-width:1200px;margin:auto;padding:0 18px 40px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 0}.logo{font-weight:800;font-size:20px}

.cols{display:grid;grid-template-columns:360px 1fr;gap:14px;align-items:start}@media(max-width:860px){.cols{grid-template-columns:1fr}}

.chk{font-size:14px;padding:2px 0}.chk.y::before{content:"✓ ";color:var(--ok);font-weight:700}.chk.n::before{content:"✗ ";color:var(--bad);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:500}
.q{border-left:3px solid var(--acc);padding-left:11px;margin:8px 0;white-space:pre-wrap}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.err{color:var(--bad);font-size:13.5px;margin-top:6px}.bar{height:8px;border-radius:4px;background:var(--acc);margin-top:4px}
.ws{display:grid;grid-template-columns:210px 1fr 270px;gap:12px;align-items:start}@media(max-width:980px){.ws{grid-template-columns:1fr}}tr.clk{cursor:pointer}tr.clk.on{background:var(--accbg)}.hero2{background:linear-gradient(120deg,#3452d9,#7c3aed);color:#fff;border-radius:20px;padding:22px 24px;margin-bottom:14px}
.hero2 h2{font-size:24px;margin:0}.hero2 .mini{opacity:.85;font-size:14px;margin:2px 0 12px}
.inrow{display:flex;gap:8px}.inrow input{flex:1;font:inherit;padding:12px 14px;border:0;border-radius:12px;color:#101a33}
.btn.w{background:#fff;color:#3452d9}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chips button{font:inherit;font-size:13px;color:#fff;background:rgba(255,255,255,.18);border:0;border-radius:99px;padding:5px 12px;cursor:pointer}.chips button:hover{background:rgba(255,255,255,.3)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{border-radius:16px;padding:13px 15px;border:1px solid var(--line);background:color-mix(in srgb,var(--kc) 13%,var(--card))}.kpi b{font-size:32px;line-height:1.1;display:block;color:var(--kc)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{position:relative;text-align:left;font:inherit;color:inherit;border:1px solid var(--line);border-radius:16px;padding:16px 15px 12px;background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:7px;min-height:176px;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--tc,var(--line))}.tile:hover{border-color:var(--tc,var(--acc))}
.tile .ans{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.tile .ft{margin-top:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.s-sent{--tc:var(--ok)}.s-asked{--tc:#d99100}.s-research{--tc:var(--acc)}.s-working{--tc:#8b5cf6}.s-call{--tc:#e11d74}
.mt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--tc) 9%,var(--card))}.mt b{display:block}
#dlg{width:min(1240px,96vw);max-height:92vh;overflow:auto;border:0;border-radius:18px;padding:16px;background:var(--bg);color:var(--ink)}#dlg::backdrop{background:rgba(10,15,30,.55)}.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
body{-webkit-font-smoothing:antialiased}:root{--ease:cubic-bezier(.2,.7,.2,1)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(10px)}
.tile{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}.tile:hover{transform:translateY(-3px);box-shadow:0 12px 26px -14px rgba(16,26,51,.4)}.tile:active{transform:scale(.99)}
.tile.enter{animation:enter .42s var(--ease) both}.tile.flash{animation:flash .7s ease}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--tc) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.sk{height:11px;border-radius:6px;background:linear-gradient(90deg,var(--line) 25%,color-mix(in srgb,var(--line) 40%,var(--card)) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}.sk.s2{width:82%}.sk.s3{width:55%}
@keyframes sh{to{background-position:-200% 0}}
.fade{animation:fd .32s var(--ease)}@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kpi b{display:inline-block;transition:color .3s}.kpi b.pop{animation:pp .38s var(--ease)}@keyframes pp{50%{transform:scale(1.14)}}
#dlg[open]{animation:dl .26s var(--ease)}@keyframes dl{from{opacity:0;transform:translateY(16px) scale(.98)}}#dlg::backdrop{animation:bd .26s ease}@keyframes bd{from{opacity:0}}
.btn{transition:transform .12s,opacity .2s,background .2s}.btn:active{transform:scale(.97)}.tabs button{transition:background .2s,color .2s}.chips button{transition:background .2s}
.inrow input:focus-visible{outline:3px solid rgba(255,255,255,.55)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

:root{--bg:#e8edf5;--card:#fbfdff;--ink:#0b1220;--mute:#56647c;--line:#cfd8e6;--acc:#0e7490;--accbg:#d3eef5;--ok:#3f7d0b;--okbg:#e2f3cc;--warn:#935a00;--warnbg:#fbeac2;--bad:#be123c;--badbg:#fde0e7;--grid:rgba(14,116,144,.07)}

body{font-family:"Space Grotesk","Plus Jakarta Sans",system-ui,sans-serif;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:34px 34px}

</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap"></head><body><div class="wrap" style="max-width:1320px">
<div class="top"><span class="logo">Orbit Ops</span><span class="mute">Project manager console</span>
<div class="tabs"><button id="b1" class="on">Queue</button><button id="b2">Human desk</button><button id="b3">Throughput</button><button id="b4">Categories</button><button id="b5">What is real</button></div></div>
<div class="stats" id="stats"></div><div id="main"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tag={R:['Rule','pill'],L:['Live AI','pill ok'],S:['Simulated','pill warn']};
const CATS=[[12,'Bookings','Making reservations, contacting someone',1,1,1,'AI + call'],[13,'Calendar','Adding or editing calendar tasks',1,1,1,'Fully AI'],[9,'Camps','Summer and winter camps for kids',7,1,1,'AI + call'],[15,'Checklists','Checklist to help the client act on their end',3,1,1,'Fully AI'],[7,'Classes','Organized activities for children',3,1,1,'AI + call'],[6,'Family Activities','Hikes, museums, playgrounds',2,1,1,'Fully AI'],[19,'Follow-ups','Tasks the Minerva asked for a reminder on',7,0,0,'Fully AI'],[29,'Forms/Applications','Filling forms (school, health, camps)',5,1,1,'Fully AI'],[2,'Hotels','Hotels, Airbnbs, places to stay',2,1,1,'Fully AI'],[30,'Itinerary','Travel plans with pricing',3,1,1,'Fully AI'],[3,'Meal Planning','Meal plans, ideas, grocery lists',1,1,1,'Fully AI'],[20,'Parent','Parent task (container)',0,0,0,'Fully AI'],[10,'Postings','Job posting or ad to sell an item',1,1,1,'Fully AI'],[4,'Products','Product recommendations and ideas',2,1,1,'Fully AI'],[11,'Purchases','Buying a specific pre-decided item',1,1,1,'AI + call'],[16,'Reminder','Customer asks us to remind them',2,1,1,'Fully AI'],[1,'Restaurants','Restaurant recommendations',2,1,1,'Fully AI'],[27,'SP - Auto','Service providers for cars',4,1,1,'AI + call'],[25,'SP - Health','Medical care providers',5,1,1,'AI + call'],[23,'SP - Home','Home repairs and maintenance',3,1,1,'AI + call'],[28,'SP - Inquiry','Follow up with a specific provider',1,1,1,'AI + call'],[26,'SP - Other','Providers outside other categories',4,1,1,'AI + call'],[24,'SP - Pets','Pet care providers',3,1,1,'AI + call'],[18,'Team Task','Internal team work',1,0,0,'Human'],[22,'Tracker','Summarizing, tracking',1,0,1,'Fully AI'],[5,'Travel Transportation','Flights, rental cars, RVs',3,1,1,'AI + call'],[31,'SP - Events','Event providers, party packages, catering',4,1,1,'AI + call']];
const PREM=['Itinerary','Forms/Applications'],cat=n=>CATS.find(c=>c[1]===n)||[0,n,'',0,1,1,'AI + call'];
const tasks=[
{id:1,title:'Flight NYC to Detroit, Dec 1, late as possible',cat:'Travel Transportation',plan:'Premium',due:20,status:'ready',tta:3,
 raw:'Siddhant flies New York to Detroit Tue Dec 1, as late as possible. Conference ends ~6 PM, school Wednesday. Prefer evening from JFK or LGA; Wed early backup only (EWR ok). Confirm pricing.',
 asks:['Tue evening/late from JFK or LGA','Time to reach airport after 6 PM','Wed early backup, EWR ok','Confirmed pricing'],missing:[],human:null,delivery:'inline',
 draft:'Hi! Here are 3 options for Dec 1. A: LGA 9:05 PM, $214. B: JFK 9:50 PM, $189. Backup C: EWR Wed 6:10 AM, $142. Tell me which you prefer and I will hold the fare.',
 research:['Searched evening and late JFK/LGA to DTW flights','Dropped departures before 8 PM (too tight after 6 PM)','Priced three options with the same fields'],notes:['Category set to Travel Transportation','Not a premium-only task'],
 trace:[['R','Request arrived, task started automatically'],['S','Split into 4 asks'],['R','Required details present'],['S','Searched and priced 3 flights'],['R','Quality gate passed, reply drafted inline']]},
{id:2,title:'Quarterly cleaning quote, Heavenly Maids',cat:'SP - Home',plan:'Essential',due:15,status:'asked',tta:4,
 raw:'Get a quote from Heavenly Maids for cleaning every 3 months, first service Oct 22. Show one-time vs quarterly price. Add deck furniture. They have serviced this home before.',
 asks:['Quarterly from Oct 22','One-time vs quarterly price','Deck furniture','Prior service noted'],missing:['Service address'],question:'Hi! To request your Heavenly Maids quote I need the service address. Is it the same home they cleaned before?',human:{type:'Call',desc:'Call Heavenly Maids to confirm the Oct 22 slot',who:'',done:false,locked:true},delivery:'inline',
 draft:'(Waiting for the service address before requesting the quote.)',research:[],notes:['Category set to SP - Home','Paused: address missing, customer already asked'],
 trace:[['R','Request arrived, task started automatically'],['S','Split into 4 asks'],['R','Gate failed: service address missing'],['R','Customer asked immediately, not marked ready for review']]},
{id:3,title:'Will and trust attorney for Neha',cat:'SP - Other',plan:'Premium',due:-30,status:'ready',tta:5,
 raw:'Neha wants a will and trust attorney. Unsure if meetings must be in person or how many sessions. Office location is a soft preference. Check earlier recommendations first.',
 asks:['Check prior recommendations','Specialists near her','In-person required?','Typical session count'],missing:[],human:{type:'Appointment',desc:'Book free consultation after Neha picks',who:'',done:false,locked:true},delivery:'inline',
 draft:'Hi Neha, two attorneys: Biddle Law (2.7 mi, flat fee, email and Zoom) and Singh Law Firm (free consult, Zoom or office). Neither requires an in-person visit; expect 2 to 3 sessions.',
 research:['No earlier recommendations found in correspondence','Two will and trust firms near San Mateo','Meeting format and sessions pulled from each firm site'],notes:['Category set to SP - Other','Past due: was waiting for a person to pick it up'],
 trace:[['R','Request arrived, task started automatically'],['S','Searched prior correspondence: none'],['S','Researched 2 firms'],['R','Quality gate passed, reply drafted inline']]}];
let sel=1,tab=1,nid=4,busy=false,err='';
const key=t=>t.status==='sent'&&t.human&&!t.human.locked&&!t.human.done?'call':t.status;
const stat=t=>({sent:['Answered by AI','ok'],asked:['Asked customer','warn'],research:['Queued for research','acc'],working:['AI working',''],call:['Needs a call','bad'],ready:['Ready','acc']})[key(t)];
const late=t=>t.status!=='sent'&&t.due<0,find=id=>tasks.find(x=>x.id===id);
function topStats(){const n=tasks.length,done=tasks.filter(t=>t.status!=='working'),k=x=>tasks.filter(t=>key(t)===x).length,avg=done.length?Math.round(done.reduce((a,t)=>a+t.tta,0)/done.length):0;
 $('#stats').className='kpis';$('#stats').innerHTML=[['Answered on arrival',done.length+'/'+n,'var(--ok)'],['Avg time to answer',avg+' s','var(--acc)'],['Waiting on customer',k('asked'),'#d99100'],['Queued for research',k('research'),'#7c3aed'],['Need a call',k('call'),'#e11d74'],['Past due',tasks.filter(late).length,'var(--bad)']].map(x=>`<div class="kpi" style="--kc:${x[2]}"><span class="mute">${x[0]}</span><b>${x[1]}</b></div>`).join('')}
function checks(t){const prem=PREM.includes(t.cat)&&t.plan==='Essential';return[[!t.missing.length,'No required detail missing'],[!prem,prem?'Premium-only task on an Essential plan: needs upgrade or approval':'Task is allowed on the customer plan'],[t.asks.length>0,t.asks.length+' asks tracked and answered'],[t.delivery==='inline','Delivered inline, no doc needed'],[true,'Human steps limited to calls and bookings']]}
function ws(t){if(!t)return'';const c=cat(t.cat),h=t.human;
 const row=(k,v)=>`<div style="margin-bottom:10px"><div class="mute">${k}</div><b>${v}</b></div>`;
 return`<div class="ws"><div class="card">${row('Task ID',29000+t.id)}${row('Category',esc(t.cat))}${row('Status',`<span class="pill ${stat(t)[1]}">${stat(t)[0]}</span>${late(t)?'<span class="pill bad">Past due</span>':''}`)}${row('Plan',t.plan)}${row('Typical length',c[3])}${row('Billable',c[4]?'Yes':'No')}${row('Shared with client',c[5]?'Yes':'No')}${row('Handled by',h?'AI + a person for the '+h.type.toLowerCase():'AI only')}${row('First action',t.tta+' s after arrival')}</div>
 <div><div class="card"><h3>Client thread</h3><div class="mute">${esc(t.raw)}</div><h3 style="margin-top:12px">AI answer (sent automatically)</h3><div class="q">${t.missing.length?esc(t.question):esc(t.draft)}</div>
 <div class="row">${t.status==='asked'?`<div class="row" style="width:100%"><input id="cr" placeholder="Demo: type the customer's reply" style="flex:1;min-width:180px;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)"><button class="btn ghost sm" onclick="answered(${t.id})">Send customer reply</button></div>`:''}</div></div>
 <div class="card"><h3>Task research</h3>${t.research.length?t.research.map(r=>`<div class="tr"><span class="pill ${t.live?'ok':'warn'}">${t.live?'Live search':'Simulated'}</span><span>${esc(r)}</span></div>`).join(''):'<div class="mute">No research yet. Connect a search tool to fill this automatically.</div>'}</div>
 ${t.debate?`<div class="card"><h3>Agent debate</h3>${t.debate.map(d=>`<div class="tr"><span class="pill acc">${esc(d.role.split(':')[0])}</span><span>${d.role.includes(':')?'<b>'+esc(d.role.split(': ')[1])+'</b><br>':''}${esc(d.text)}</span></div>`).join('')}</div>`:''}${costCard(t)}<div class="card"><h3>Quality gate</h3>${checks(t).map(c=>`<div class="chk ${c[0]?'y':'n'}">${c[1]}</div>`).join('')}</div></div>
